<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POCIKA — Redirecting...</title>
</head>
<body>
  <script>
    try {
      const stored = sessionStorage.getItem('pocika_user_profile');
      if (stored) {
        const profile = JSON.parse(stored);
        if (profile.role === 'admin' || profile.role === 'super_admin' || (profile.email && profile.email.toLowerCase() === 'admin@pocika.com')) {
          window.location.href = "pages/admin-dashboard.html";
        } else {
          window.location.href = "pages/dashboard.html";
        }
      } else {
        window.location.href = "pages/dashboard.html";
      }
    } catch (e) {
      window.location.href = "pages/dashboard.html";
    }
  </script>
</body>
</html>
