<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - POCIKA Inquiry System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="../css/main.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  
  <div class="card border-0 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 12px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <img src="../assets/logo/pocika-logo.png" alt="POCIKA Logo" height="40" class="mb-3">
        <h4 class="fw-bold mb-1">Welcome Back</h4>
        <p class="text-muted small">Sign in to access the system</p>
      </div>

      <form id="login-form">
        <div id="login-error" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>
        
        <div class="mb-3">
          <label class="form-label small fw-medium">Email Address</label>
          <input type="email" class="form-control" id="email" required placeholder="admin@pocika.com">
        </div>
        
        <div class="mb-4">
          <label class="form-label small fw-medium">Password</label>
          <input type="password" class="form-control" id="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium" id="btn-login">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
